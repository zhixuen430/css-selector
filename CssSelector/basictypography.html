<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Typography Units</title>
    <style>
        html{
            font-size: 16px;
        }
        h1{
            font-size: 36px;
        }
        h2{
            font-size: 1.5em;
        }
        p{
            font-size: 1rem;
        }
        .highlight{
            font-size: 2em;
            background-color: orange;
            color: orangered;  
            font-weight: bold;
        }
        .container{
            border: 2px solid gray;
            background-color: lightgray;
            padding: 10px;
        }
        hr{
            height: 4px;
            color: #525050;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Main Heading with Pixels</h1>
        <hr>
        <h2>Subheading with Ems</h2>
        <p>Body text using rems...</p>
        <p>Text with <span class="highlight">highlighted content</span> using ems.</p>
    </div>
</body>
</html>
